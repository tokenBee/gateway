services:
  api:
    build: ./TokenBee
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=YOUR_DB
      - Compression__SidecarUrl=http://sidecar:8000
    depends_on:
      - sidecar

  sidecar:
    build: ./compression-sidecar
    ports:
      - "8000:8000"
    volumes:
      - compressor-cache:/app/model-cache
    environment:
      - HF_HOME=/app/model-cache

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_PASSWORD=yourpassword
    ports:
      - "5432:5432"

volumes:
  compressor-cache:
